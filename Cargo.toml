[workspace]
members = ["core", "runner-shell", "runner-claude", "registry", "scheduler-launchd", "schedule", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vigil-core = { path = "core" }
vigil-schedule = { path = "schedule" }
vigil-runner-shell = { path = "runner-shell" }
vigil-runner-claude = { path = "runner-claude" }
vigil-registry = { path = "registry" }
vigil-scheduler-launchd = { path = "scheduler-launchd" }
plist = "1"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
derive_more = { version = "2", features = ["display", "from", "from_str"] }
libsql = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-escape = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
